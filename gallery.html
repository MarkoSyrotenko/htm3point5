<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gallery</title>
        <link rel="stylesheet" type="text/css" href="style.css" />
    </head>
    <body style="background-color: #F5F5F5;">
        <div class="gallery">

        <h2>CATS GALLERY</h2>

        <iframe
            class="bigimage"
            name="bigimage"
            title="bigimage"
            src='img/cat_box_256.png'>
        </iframe>

        <div class="thumbnails">
            <a href='img/cat_box_256.png'
               target="bigimage" title="box">
                <img src='img/cat_box_64.png'>
            </a>
            <a href='img/cat_cage_256.png'
               target="bigimage" title="cage">
                <img src='img/cat_cage_64.png'>
            </a>
            <a href='img/cat_clean_256.png'
               target="bigimage" title="clean">
                <img src='img/cat_clean_64.png'>
            </a>
            <a href='img/cat_eyes_256.png'
               target="bigimage" title="eyes">
                <img src='img/cat_eyes_64.png'>
            </a>
            <a href='img/cat_purr_256.png'
               target="bigimage" title="purr">
                <img src='img/cat_purr_64.png'>
            </a>
            <a href='img/cat_tied_256.png'
               target="bigimage" title="tied">
                <img src='img/cat_tied_64.png'>
            </a>
        </div>
    </div>
    </body>
</html>
